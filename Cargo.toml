[package]
name = "linux-and-you"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[profile.release]
lto = true
codegen-units = 1

[dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_7"] }
anyhow = "1"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_18"] }
serde = { version = "1", features = ["derive"] }
soup = { package = "soup3", version = "0.8", features = ["v3_4"] }
serde_json = "1"
roxmltree = "0.20"
tracing = "0.1"
tracing-subscriber = "0.3"
wayland-client = "0.31"
