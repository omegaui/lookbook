<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Distros</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0;background:#deddda}
a{color:#1c71d8}a:hover{color:#1a5fb4}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #1e1e23; background: #deddda; padding: clamp(0px, 2vw, 24px); box-sizing: border-box; min-height: 100vh">
<div style="max-width: 1232px; margin: 0 auto; background: #fafafb; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,6,0.12), 0 12px 40px rgba(0,0,6,0.12); overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; flex-wrap: wrap">
<div style="flex: 1 1 0; min-width: 0"></div>
<nav aria-label="Sections" style="display: flex; gap: 4px; flex-wrap: wrap; justify-content: center">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 40px; border-radius: 10px; color: #1e1e23; font-weight: 600; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5z"></path></svg>Explore</a>
<a href="Distros.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 40px; border-radius: 10px; background: rgba(0,0,6,0.08); color: #1e1e23; font-weight: 700; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"></path><path d="m3 13 9 5 9-5"></path></svg>Distros</a>
<a href="Desktops.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 40px; border-radius: 10px; color: #1e1e23; font-weight: 600; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>Desktops</a>
<a href="Compositors.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 40px; border-radius: 10px; color: #1e1e23; font-weight: 600; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="16" rx="2"></rect><rect x="13" y="4" width="8" height="7" rx="2"></rect><rect x="13" y="13" width="8" height="7" rx="2"></rect></svg>Compositors</a>
<a href="YourSystem.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 0 16px; height: 40px; border-radius: 10px; color: #1e1e23; font-weight: 600; font-size: 15px; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"></rect><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"></path></svg>Your System</a>
</nav>
<div style="flex: 1 1 0; display: flex; justify-content: flex-end; gap: 4px">
<button aria-label="Main menu" style="width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; color: #1e1e23; display: grid; place-items: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
<button aria-label="Close" style="width: 40px; height: 40px; border: 0; background: transparent; color: #1e1e23; display: grid; place-items: center; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 99px; background: rgba(0,0,6,0.08); display: grid; place-items: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"></path></svg></span></button>
</div>
</header>

<main style="padding: 8px clamp(16px, 3vw, 32px) 40px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<div>
<h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em">Distros</h1>
<p style="margin: 4px 0 0; font-size: 15px; color: #5e5c64">{{countText}}</p>
</div>
<div style="flex: 0 1 360px; min-width: 240px">
<label for="distro-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search distros</label>
<div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; background: rgba(0,0,6,0.06); color: #46454d">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
<input id="distro-search" type="search" placeholder="Search distros" style="flex: 1; min-width: 0; border: 0; background: transparent; font-family: inherit; font-size: 15px; color: #1e1e23; outline: none">
</div>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<span style="font-size: 13px; font-weight: 700; color: #5e5c64; text-transform: uppercase; letter-spacing: 0.06em">Family</span>
<sc-for list="{{families}}" as="f" hint-placeholder-count="5">
<sc-if value="{{f.active}}" hint-placeholder-val="{{false}}"><button aria-pressed="true" onClick="{{f.pick}}" style="height: 36px; padding: 0 14px; border-radius: 99px; border: 0; background: #1e1e23; color: #ffffff; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">{{f.label}}</button></sc-if>
<sc-if value="{{f.idle}}" hint-placeholder-val="{{true}}"><button aria-pressed="false" onClick="{{f.pick}}" style="height: 36px; padding: 0 14px; border-radius: 99px; border: 0; background: rgba(0,0,6,0.06); color: #1e1e23; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer">{{f.label}}</button></sc-if>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<span style="font-size: 13px; font-weight: 700; color: #5e5c64; text-transform: uppercase; letter-spacing: 0.06em">Release</span>
<sc-for list="{{releases}}" as="r" hint-placeholder-count="4">
<sc-if value="{{r.active}}" hint-placeholder-val="{{false}}"><button aria-pressed="true" onClick="{{r.pick}}" style="height: 36px; padding: 0 14px; border-radius: 99px; border: 0; background: #1e1e23; color: #ffffff; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer">{{r.label}}</button></sc-if>
<sc-if value="{{r.idle}}" hint-placeholder-val="{{true}}"><button aria-pressed="false" onClick="{{r.pick}}" style="height: 36px; padding: 0 14px; border-radius: 99px; border: 0; background: rgba(0,0,6,0.06); color: #1e1e23; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer">{{r.label}}</button></sc-if>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px">
<sc-for list="{{shown}}" as="d" hint-placeholder-count="12">
<a href="Distro.dc.html" style="display: flex; flex-direction: column; background: #ffffff; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,6,0.07), 0 2px 4px rgba(0,0,6,0.05); text-decoration: none; color: #1e1e23">
<span aria-hidden="true" style="position: relative; height: 112px; background: {{d.tint}}; display: grid; place-items: center; overflow: hidden">
<span style="position: absolute; width: 150px; height: 150px; border-radius: 28px; background: rgba(255,255,255,0.45); transform: rotateX(55deg) rotateZ(-45deg)"></span>
<span style="position: relative; width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; font-size: 22px; font-weight: 800; color: #ffffff; background: {{d.color}}; box-shadow: 0 6px 0 rgba(0,0,6,0.22), 0 14px 18px rgba(0,0,6,0.12)">{{d.short}}</span>
</span>
<span style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 16px">
<span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span style="font-weight: 700; font-size: 17px">{{d.name}}</span><sc-if value="{{d.current}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 700; color: #1a5fb4; background: #dbe8fb; padding: 2px 8px; border-radius: 99px">You are here</span></sc-if></span>
<span style="font-size: 14px; line-height: 1.35; color: #5e5c64">{{d.tag}}</span>
<span style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px"><span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #f0f0f3; color: #3d3846">{{d.release}}</span><span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #f0f0f3; color: #3d3846">{{d.base}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #f0f0f3; color: #3d3846">{{d.pm}}</span></span>
</span>
</a>
</sc-for>
</div>

<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="padding: 48px 16px; text-align: center; color: #5e5c64; font-size: 16px">No distros match these filters.</div>
</sc-if>

</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1340}}'>
class Component extends DCLogic {
  distros() {
    return [
      { name: 'Fedora Workstation', short: 'Fe', color: '#3c6eb4', tint: '#e3ebf7', family: 'fedora', base: 'Independent', release: 'Fixed', pm: 'dnf', tag: 'Polished GNOME desktop with fresh upstream software' },
      { name: 'Arch Linux', short: 'Ar', color: '#1793d1', tint: '#def1fa', family: 'independent', base: 'Independent', release: 'Rolling', pm: 'pacman', tag: 'A simple base you build up yourself', current: true },
      { name: 'Debian', short: 'De', color: '#a80030', tint: '#f8e0e7', family: 'debian', base: 'Independent', release: 'Fixed', pm: 'apt', tag: 'The universal operating system, known for stability' },
      { name: 'Ubuntu', short: 'Ub', color: '#e95420', tint: '#fde6dc', family: 'debian', base: 'Debian', release: 'Fixed', pm: 'apt', tag: 'Popular desktop with long-term support releases' },
      { name: 'Linux Mint', short: 'Mi', color: '#5b8f22', tint: '#e8f3dc', family: 'debian', base: 'Ubuntu', release: 'Fixed', pm: 'apt', tag: 'Familiar Cinnamon desktop for people new to Linux' },
      { name: 'openSUSE Tumbleweed', short: 'Tw', color: '#4f8a14', tint: '#e6f2da', family: 'independent', base: 'Independent', release: 'Rolling', pm: 'zypper', tag: 'Tested rolling release with Btrfs snapshots' },
      { name: 'NixOS', short: 'Nx', color: '#5277c3', tint: '#e5ebf7', family: 'independent', base: 'Independent', release: 'Fixed', pm: 'nix', tag: 'Describe your whole system in one config file' },
      { name: 'CachyOS', short: 'Ca', color: '#00896e', tint: '#d9f2ec', family: 'arch', base: 'Arch', release: 'Rolling', pm: 'pacman', tag: 'Arch with performance-tuned kernels and packages' },
      { name: 'Bazzite', short: 'Bz', color: '#6c3fc5', tint: '#ece4f9', family: 'fedora', base: 'Fedora', release: 'Atomic', pm: 'rpm-ostree', tag: 'Atomic Fedora image tuned for gaming' },
      { name: 'Fedora Silverblue', short: 'Si', color: '#294172', tint: '#e1e6f0', family: 'fedora', base: 'Fedora', release: 'Atomic', pm: 'rpm-ostree', tag: 'Atomic Fedora with GNOME and Flatpak apps' },
      { name: 'Pop!_OS', short: 'Po', color: '#2a7f8a', tint: '#dcf0f2', family: 'debian', base: 'Ubuntu', release: 'Fixed', pm: 'apt', tag: 'Ubuntu-based home of the COSMIC desktop' },
      { name: 'elementary OS', short: 'el', color: '#2a6fc0', tint: '#e0ecfa', family: 'debian', base: 'Ubuntu', release: 'Fixed', pm: 'apt', tag: 'Pantheon desktop with a curated app store' },
      { name: 'EndeavourOS', short: 'En', color: '#7f3fbf', tint: '#efe3f8', family: 'arch', base: 'Arch', release: 'Rolling', pm: 'pacman', tag: 'Arch made easy, with a friendly installer' },
      { name: 'Void Linux', short: 'Vo', color: '#478061', tint: '#e0eee6', family: 'independent', base: 'Independent', release: 'Rolling', pm: 'xbps', tag: 'Independent rolling distro with runit and xbps' },
      { name: 'Alpine Linux', short: 'Al', color: '#0d597f', tint: '#dcebf3', family: 'independent', base: 'Independent', release: 'Fixed', pm: 'apk', tag: 'Small, simple and secure, built on musl' },
      { name: 'Gentoo', short: 'Ge', color: '#54487a', tint: '#e8e5f1', family: 'independent', base: 'Independent', release: 'Rolling', pm: 'portage', tag: 'Build every package from source, your way' }
    ];
  }

  chips(list, current, key) {
    return list.map((item) => ({
      label: item.label,
      active: item.id === current,
      idle: item.id !== current,
      pick: () => this.setState({ [key]: item.id })
    }));
  }

  renderVals() {
    const family = (this.state && this.state.family) || 'all';
    const release = (this.state && this.state.release) || 'any';
    const shown = this.distros().filter((d) => {
      const familyMatches = family === 'all' || d.family === family;
      const releaseMatches = release === 'any' || d.release.toLowerCase() === release;
      return familyMatches && releaseMatches;
    });

    return {
      families: this.chips([
        { id: 'all', label: 'All' },
        { id: 'independent', label: 'Independent' },
        { id: 'arch', label: 'Arch' },
        { id: 'debian', label: 'Debian' },
        { id: 'fedora', label: 'Fedora' }
      ], family, 'family'),
      releases: this.chips([
        { id: 'any', label: 'Any' },
        { id: 'rolling', label: 'Rolling' },
        { id: 'fixed', label: 'Fixed' },
        { id: 'atomic', label: 'Atomic' }
      ], release, 'release'),
      shown: shown,
      empty: shown.length === 0,
      countText: shown.length === 1 ? '1 distro' : shown.length + ' distros'
    };
  }
}
</script>
</body>
</html>
