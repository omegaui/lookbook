# Parses a catalog with the app's own model, so the Catalog workflow never
# publishes a file the app would reject. It compiles src/catalog/model.rs and
# protocols.rs directly, with a stand-in for gettext, so it needs no GTK.
#
#   cargo run --manifest-path catalog/model-check/Cargo.toml -- _site/v1/catalog.json
[package]
name = "catalog-model-check"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gettextrs = { package = "gettext-shim", path = "gettext-shim" }

# Not part of the app's build.
[workspace]
